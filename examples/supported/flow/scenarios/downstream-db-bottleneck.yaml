flow_runtime:
  name: checkout-db-bottleneck
  signals:
    kafka_consumer_lag_increasing: true
    kafka_broker_unhealthy: false
    db_latency_ms: 920
    api_error_rate_percent: 2
    api_timeout_rate_percent: 1
    consumer_retry_rate_percent: 2
  components:
    api:
      type: api
      signals:
        unhealthy: false
    kafka:
      type: kafka
      signals:
        unhealthy: false
    consumer:
      type: consumer
      depends_on: [kafka]
      signals:
        unhealthy: true
    database:
      type: database
      signals:
        unhealthy: true
