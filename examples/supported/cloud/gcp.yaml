cloud_inventory:
  resources:
    - type: google_storage_bucket
      name: claim-exports
      config:
        name: claim-exports
        location: us-central1
        environment: prod
        uniform_bucket_level_access: false
    - type: google_project_iam_binding
      name: platform-owner
      config:
        project: claims-platform
        role: roles/owner
        members:
          - group:platform@example.com
    - type: google_sql_database_instance
      name: claims-sql
      config:
        region: us-central1
        environment: prod
        deletion_protection: false
        settings:
          - availability_type: ZONAL
            ip_configuration:
              - ipv4_enabled: true
                authorized_networks:
                  - name: office
                    value: 0.0.0.0/0
            backup_configuration:
              - enabled: false
    - type: google_compute_firewall
      name: public-api
      config:
        region: us-central1
        environment: prod
        direction: INGRESS
        source_ranges:
          - 0.0.0.0/0
        allow:
          - protocol: tcp
            ports:
              - "443"
    - type: google_container_cluster
      name: claims-gke
      config:
        region: us-central1
        environment: prod
        location: us-central1-a
        private_cluster_config:
          - enable_private_nodes: false
    - type: cloud_quota_profile
      name: gcp-compute-quota
      config:
        provider: gcp
        quota_limit: 20
        required_capacity: 18
        reserved_buffer: 4
