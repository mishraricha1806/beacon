cloud_inventory:
  resources:
    - type: azurerm_storage_account
      name: claimsarchive
      config:
        id: /subscriptions/example/resourceGroups/claims/providers/Microsoft.Storage/storageAccounts/claimsarchive
        location: eastus
        environment: prod
        allow_blob_public_access: true
        infrastructure_encryption_enabled: false
    - type: azurerm_role_assignment
      name: platform-contributor
      config:
        role_definition_name: Contributor
        principal_id: platform-team
        scope: /subscriptions/example-subscription
    - type: azurerm_postgresql_flexible_server
      name: claims-postgres
      config:
        id: /subscriptions/example/resourceGroups/claims/providers/Microsoft.DBforPostgreSQL/flexibleServers/claims-postgres
        location: eastus
        environment: prod
        public_network_access_enabled: true
        backup_retention_days: 3
        deletion_protection_enabled: false
        high_availability:
          - mode: Disabled
    - type: azurerm_key_vault
      name: claims-vault
      config:
        id: /subscriptions/example/resourceGroups/claims/providers/Microsoft.KeyVault/vaults/claims-vault
        location: eastus
        environment: prod
        public_network_access_enabled: true
        purge_protection_enabled: false
        network_acls:
          - default_action: Allow
    - type: azurerm_linux_virtual_machine_scale_set
      name: claims-api-vmss
      config:
        id: /subscriptions/example/resourceGroups/claims/providers/Microsoft.Compute/virtualMachineScaleSets/claims-api-vmss
        location: eastus
        environment: prod
        instances: 4
        max_capacity: 4
    - type: cloud_quota_profile
      name: azure-compute-quota
      config:
        provider: azure
        quota_limit: 10
        required_capacity: 9
        reserved_buffer: 2
