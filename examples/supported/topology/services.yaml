topology:
  services:
    - name: auth
      owner: team-platform
      criticality: critical
      business_impact: Authentication outage blocks customer checkout and payment flows.
      instances: 1
    - name: payments
      owner: team-payments
      depends_on: [auth]
    - name: orders
      owner: team-orders
      depends_on: [auth]
    - name: profile
      owner: team-profile
      depends_on: [auth]
