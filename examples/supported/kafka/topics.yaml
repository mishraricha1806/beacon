kafka:
  topics:
    - name: payments
      replication_factor: 1
      partitions: 1
      retention_ms: -1
      cleanup_policy:
      min_insync_replicas:
      max_message_bytes: 20971520
      replica_placements:
        - partition: 0
          replicas: [1, 2, 3]
          replica_racks: [az-a, az-a, az-a]
      schema_compatibility: NONE
      owner:
    - name: audit-events
      replication_factor: 2
      partitions: 2
      retention_bytes:
      cleanup_policy:
    - name: customer-state
      replication_factor: 3
      partitions: 12
      retention_bytes:
      cleanup_policy: compact
      delete_retention_ms: 3600000
      min_cleanable_dirty_ratio: 0.75
      key_cardinality_estimate: 2500000
  producers:
    - name: checkout-producer
      topic: payments
      acks: 1
      enable_idempotence: false
      retries: 3
      max_in_flight_requests_per_connection: 10
      compression_type: none
  consumers:
    - name: payment-worker
      topic: payments
      group_id: payment-worker
      partitions: 2
      consumer_concurrency: 5
      enable_auto_commit: true
      auto_offset_reset: latest
      max_poll_interval_ms: 30000
      session_timeout_ms: 10000
      heartbeat_interval_ms: 5000
      retry_max_attempts: 5
      dlq_topic:
