schema_registry:
  url: http://schema-registry.local:8081
  max_subjects: 25
  auth:
    type: bearer_token
    token: example-read-only-token
  tls:
    ca_cert: examples/supported/kafka/certs/ca.pem
    client_cert: examples/supported/kafka/certs/payments-client.pem
    client_key: examples/supported/kafka/certs/payments-client.key
  expected_topics:
    - name: payments
      subjects:
        - payments-key
        - payments-value
    - name: audit-events
      subjects:
        - audit-events-value
