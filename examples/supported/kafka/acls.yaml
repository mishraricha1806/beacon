kafka_acls:
  - principal: User:payments-service
    host: "*"
    operation: READ
    permission_type: ALLOW
    resource_type: TOPIC
    resource_name: payments
    resource_pattern_type: LITERAL
  - principal: User:*
    host: "*"
    operation: ALL
    permission_type: ALLOW
    resource_type: TOPIC
    resource_name: "*"
    resource_pattern_type: LITERAL
