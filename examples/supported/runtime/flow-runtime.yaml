flow_runtime:
  name: checkout
  owner: team-checkout
  criticality: critical
  business_impact: Checkout completion, payment capture, and order confirmation are at risk.
  affected_services:
    - payments
    - orders
    - fulfillment
  blast_radius:
    user_impact: Customers may not be able to complete checkout.
    revenue_impact: Payment capture can be delayed or fail.
  signals:
    kafka_consumer_lag_increasing: true
    kafka_broker_unhealthy: false
    db_latency_ms: 850
    recent_deployment: true
    api_error_rate_percent: 7
    api_timeout_rate_percent: 4
    consumer_retry_rate_percent: 9
  components:
    api:
      type: api
      signals:
        unhealthy: true
    kafka:
      type: kafka
      signals:
        unhealthy: false
    consumer:
      type: consumer
      depends_on: [kafka]
      signals:
        unhealthy: true
    database:
      type: database
      signals:
        unhealthy: true
