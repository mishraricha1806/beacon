kubernetes_runtime:
  nodes:
    - name: node-a
      ready: false
      disk_pressure: true

flow_runtime:
  name: checkout
  signals:
    kafka_consumer_lag_increasing: true
    kafka_broker_unhealthy: false
    db_latency_ms: 900
    api_timeout_rate_percent: 4
    consumer_retry_rate_percent: 10

api_runtime:
  services:
    - name: checkout-api
      latency_p95_ms: 1500
      error_rate_percent: 8
      timeout_rate_percent: 5
      retry_rate_percent: 16
      recent_deployment: true

database_runtime:
  databases:
    - name: orders-db
      engine: postgres
      latency_ms: 800
      connection_pool_utilization_percent: 95
      lock_waits_high: true
      replication_lag_seconds: 180
      storage_used_percent: 92

storage_runtime:
  resources:
    - name: orders-volume
      type: block_volume
      used_percent: 94
      growth_percent_7d: 31
      iops_saturation_percent: 90
      backup_age_hours: 48
