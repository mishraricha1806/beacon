    <g transform="translate(50 92)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 36 H160" stroke="#5a95ff"/>
      <path d="M160 36 L132 18 M160 36 L132 54" stroke="#5a95ff"/>
      <text x="5" y="86" class="small">Signals</text>
      <path d="M235 36 H395" stroke="#2bd2c5"/>
      <path d="M395 36 L367 18 M395 36 L367 54" stroke="#2bd2c5"/>
      <text x="206" y="86" class="small">Reasoning</text>
      <path d="M470 36 H630" stroke="#67db94"/>
      <path d="M630 36 L602 18 M630 36 L602 54" stroke="#67db94"/>
      <text x="466" y="86" class="small">Decision</text>
      <text x="674" y="43" class="section green">Fix first</text>
