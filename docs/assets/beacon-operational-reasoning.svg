    <rect x="42" y="46" width="416" height="108" rx="16" fill="#202b3a" stroke="#5a95ff" stroke-width="4"/>
    <text x="174" y="96" class="label blue">BEACON</text>
    <text x="112" y="130" class="small">Operational Reasoning Layer</text>

    <g transform="translate(72 196)">
      <rect x="0" y="0" width="356" height="74" rx="14" fill="#172936" stroke="#55c3ff" stroke-width="4"/>
