    </g>

    <g transform="translate(72 296)">
      <rect x="0" y="0" width="356" height="74" rx="14" fill="#172d28" stroke="#67db94" stroke-width="4"/>
      <text x="30" y="46" class="small">Correlation and root cause</text>
    </g>

    <g transform="translate(72 396)">
