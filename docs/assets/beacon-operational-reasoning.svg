    <g transform="translate(42 92)">
      <rect x="0" y="0" width="190" height="300" rx="14" fill="#202b36" stroke="#8192a5" stroke-width="4"/>
      <g stroke="#9eabb8" stroke-width="5" stroke-linecap="round">
        <path d="M26 38 H86"/>
        <path d="M26 72 H112"/>
        <path d="M26 106 H96"/>
        <path d="M26 170 H114"/>
