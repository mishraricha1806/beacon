      <text x="26" y="39" class="label">Is this production ready?</text>
      <text x="26" y="72" class="small blue">Decision: NOT READY / READY</text>
    </g>
    <g transform="translate(0 156)">
      <rect x="0" y="0" width="390" height="98" rx="16" fill="#1b2d28" stroke="#67db94" stroke-width="4"/>
      <text x="26" y="39" class="label">Why is it degrading?</text>
      <text x="26" y="72" class="small green">Root cause hypotheses</text>
    </g>
    <g transform="translate(0 277)">
      <rect x="0" y="0" width="390" height="98" rx="16" fill="#302318" stroke="#ff914d" stroke-width="4"/>
      <text x="26" y="39" class="label">What should we do first?</text>
      <text x="26" y="72" class="small orange">Safe ranked actions</text>
