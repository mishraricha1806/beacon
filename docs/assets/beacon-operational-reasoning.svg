<svg width="2048" height="1152" viewBox="0 0 2048 1152" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1160 540) rotate(90) scale(720 1020)">
      <stop stop-color="#1f3b4f" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#151b22" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0c1015"/>
    </radialGradient>
    <linearGradient id="blueStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5a95ff"/>
      <stop offset="1" stop-color="#2bd2c5"/>
    </linearGradient>
    <linearGradient id="greenStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4fdf8c"/>
      <stop offset="1" stop-color="#99f2ba"/>
    </linearGradient>
    <linearGradient id="orangeStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ff573d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 800 70px Arial, Helvetica, sans-serif; fill: #f5f7fb; letter-spacing: 0; }
      .subtitle { font: 500 26px Arial, Helvetica, sans-serif; fill: #b7c1cc; letter-spacing: 0; }
      .section { font: 800 31px Arial, Helvetica, sans-serif; fill: #f4f6fa; letter-spacing: 0; }
      .label { font: 700 27px Arial, Helvetica, sans-serif; fill: #f4f7fb; letter-spacing: 0; }
      .small { font: 500 21px Arial, Helvetica, sans-serif; fill: #c2cbd5; letter-spacing: 0; }
      .tiny { font: 700 17px Arial, Helvetica, sans-serif; fill: #8fa0ae; letter-spacing: 0; }
      .blue { fill: #66a0ff; }
      .green { fill: #67db94; }
      .orange { fill: #ff914d; }
      .muted { fill: #9ca9b5; }
    </style>
  </defs>

  <rect width="2048" height="1152" fill="url(#bgGlow)"/>
  <rect x="32" y="32" width="1984" height="1088" rx="34" stroke="#2b3440" stroke-width="2"/>

