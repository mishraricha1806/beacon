      <path d="M86 36 H170" stroke="#8d99a6" stroke-width="5"/>
      <circle cx="226" cy="36" r="32" fill="#24313d" stroke="#9aa7b5" stroke-width="4"/>
      <text x="202" y="45" class="tiny">dash</text>
      <path d="M276 36 H360" stroke="#8d99a6" stroke-width="5"/>
      <circle cx="416" cy="36" r="32" fill="#24313d" stroke="#9aa7b5" stroke-width="4"/>
      <text x="397" y="45" class="tiny">alerts</text>
      <path d="M466 36 H550" stroke="#8d99a6" stroke-width="5"/>
      <circle cx="606" cy="36" r="32" fill="#24313d" stroke="#9aa7b5" stroke-width="4"/>
      <text x="584" y="45" class="tiny">tribal</text>
      <path d="M670 2 L528 144" stroke="#f15a3c" stroke-width="16" stroke-linecap="round"/>
      <path d="M528 2 L670 144" stroke="#f15a3c" stroke-width="16" stroke-linecap="round"/>
    </g>
  </g>

