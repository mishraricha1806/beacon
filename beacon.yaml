project: beacon-demo
environment:
  name: dev
  profile: dev
  criticality: medium
  owner: platform-team
  rto: 4h
  rpo: 24h
  business_flows:
    - demo-checkout
  services:
    - checkout-api
    - payment-worker
  dependencies:
    kafka:
      clusters:
        - demo-kafka
    kubernetes:
      clusters:
        - local-dev
    storage:
      buckets:
        - customer-exports

readiness:
  include:
    - ./examples/bad-infra
  exclude:
    - ./reports
    - ./.terraform

intelligence:
  context: ./examples/supported/intelligence/context.yaml

report:
  format:
    - terminal
    - html
  open: false

live:
  runtime:
    snapshot: ./examples/supported/runtime/all-runtime.yaml
    flow: ./examples/supported/runtime/flow-runtime.yaml
    deployment_events: ./examples/supported/deployments/events.yaml
    opentelemetry: ./examples/supported/opentelemetry/checkout-otel.yaml
  kafka:
    acls: ./examples/supported/kafka/acls.yaml
    history: ./examples/supported/kafka/history.yaml
  schema_registry:
    config: ./examples/supported/kafka/schema-registry.yaml

tasks:
  prod-check:
    command: readiness
    environment: prod

  dev-check:
    command: readiness
    environment: dev

  kafka-incident-demo:
    command: diagnose kafka-runtime
    path: ./examples/supported/kafka/scenarios/quota-throttle-runtime.yaml

  flow-demo:
    command: diagnose flow
    path: ./examples/supported/runtime/flow-runtime.yaml
