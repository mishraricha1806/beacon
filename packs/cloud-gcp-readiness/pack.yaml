id: cloud-gcp-readiness
name: GCP Cloud Readiness
version: 0.1.0
status: preview
owner: beacon
summary: >
  Inspectable GCP readiness checks for Cloud SQL public access, backup,
  deletion protection, HA, Cloud Storage recovery, uniform bucket access,
  ownership labels, and broad project IAM grants that increase production blast
  radius.
domains:
  - cloud
  - cloud_identity
  - object_storage
  - terraform
provider_coverage:
  current:
    - Cloud SQL public IP and authorized network posture
    - Cloud SQL backup configuration posture
    - Cloud SQL deletion protection posture
    - Cloud SQL regional high-availability posture
    - Cloud SQL customer-managed encryption key evidence
    - Cloud SQL private connectivity evidence
    - GCP firewall public ingress posture
    - GKE private-node and control-plane access posture
    - GKE regional or multi-zone resiliency posture
    - GCP production dependency regional concentration posture
    - GCP project quota headroom posture
    - Google Cloud Storage bucket versioning posture
    - Google Cloud Storage uniform bucket-level access posture
    - Google Cloud Storage ownership/label metadata
    - GCP project IAM Owner, Editor, and admin role blast-radius checks
  planned:
    - deeper cross-region failover topology and approved exception mapping
use_cases:
  - Are GCP Cloud SQL instances publicly reachable?
  - Can GCP Cloud SQL recover through backup, deletion protection, and HA posture?
  - Do Cloud SQL dependencies have private connectivity evidence?
  - Can this GCP storage estate safely go to production?
  - Can buckets recover from accidental overwrite or delete?
  - Are object-level ACLs still enabled through disabled uniform access?
  - Are Owner, Editor, or broad admin roles attached at project scope?
  - Can GKE and project quota absorb rollout or traffic-spike capacity?
  - Are GCP production dependencies concentrated in one region?
non_goals:
  - Claiming complete GCP coverage in the first preview
  - Replacing Organization Policy, Security Command Center, OPA, or Terraform
  - Applying GCP changes or mutating cloud resources
rules:
  - rule_id: cloud.database.gcp.public_ip.enabled
    intent: GCP Cloud SQL public IP or authorized network exposure risk.
  - rule_id: cloud.database.gcp.backup.disabled
    intent: GCP Cloud SQL backup posture risk.
  - rule_id: cloud.database.gcp.deletion_protection.disabled
    intent: GCP Cloud SQL accidental deletion risk.
  - rule_id: cloud.database.gcp.ha.disabled
    intent: GCP Cloud SQL regional high-availability posture risk.
  - rule_id: cloud.database.gcp.cmek.missing
    intent: GCP Cloud SQL customer-managed encryption posture risk.
  - rule_id: cloud.network.gcp.private_connectivity.missing
    intent: GCP Cloud SQL private connectivity posture risk.
  - rule_id: cloud.network.gcp.firewall.open_ingress
    intent: GCP firewall public ingress risk.
  - rule_id: cloud.kubernetes.gcp.private_nodes.disabled
    intent: GKE worker-node public exposure risk.
  - rule_id: cloud.kubernetes.gcp.master_authorized_networks.missing
    intent: GKE control-plane access restriction risk.
  - rule_id: cloud.kubernetes.gcp.regional_resiliency.missing
    intent: GKE regional or multi-zone resiliency risk.
  - rule_id: cloud.region.gcp.dependency_concentration
    intent: GCP production dependency regional concentration risk.
  - rule_id: cloud.quota.gcp.headroom.insufficient
    intent: GCP quota capacity headroom risk.
  - rule_id: object_storage.versioning.missing
    intent: GCS bucket overwrite/delete recovery risk.
  - rule_id: object_storage.labels_or_tags.missing
    intent: GCS bucket ownership and governance metadata gap.
  - rule_id: gcp.storage.uniform_bucket_access.disabled
    intent: GCS bucket object-level ACL governance risk.
  - rule_id: iam.admin_or_owner.excessive
    intent: GCP Owner, Editor, or broad admin role blast-radius risk.
