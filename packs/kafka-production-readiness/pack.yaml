schema_version: 1.0.0
id: kafka-production-readiness
name: Kafka Production Readiness
version: 0.1.0
status: preview
owner: beacon-platform
support_tier: experimental
engine_compatibility:
  min_version: 0.1.0
  max_version_exclusive: 0.2.0
fixtures:
  - path: examples/supported/kafka/topics.yaml
    expected_rule_ids:
      - kafka.topic.replication_factor.low
deprecation:
  notice: null
  removal_after: null
  replacement: null
summary: >
  Inspectable Kafka readiness checks for release gates, production survivability,
  runtime diagnostics, and operational recovery planning.
domains:
  - kafka
  - schema_registry
use_cases:
  - Can this Kafka topology survive broker failure?
  - Can consumers keep up during traffic spikes?
  - Is Kafka client security posture acceptable for production?
  - Is storage growth caused by retention, payload size, lag, or broker pressure?
  - Are schemas and ACLs safe enough for release?
non_goals:
  - Mutating Kafka topics, ACLs, offsets, or broker configuration
  - Replacing OPA, Sentinel, admission controllers, or policy-as-code
  - Consuming or producing Kafka messages
rules:
  - rule_id: kafka.cluster.broker_count.low
    intent: Cluster-level availability signal.
  - rule_id: kafka.cluster.under_replicated_partitions
    intent: Live metadata availability signal.
  - rule_id: kafka.cluster.offline_partitions
    intent: Live metadata outage signal.
  - rule_id: kafka.cluster.under_min_isr_partitions
    intent: Live durability risk signal.
  - rule_id: kafka.cluster.leader_imbalance.high
    intent: Broker load balance signal.
  - rule_id: kafka.cluster.topic_count.high
    intent: Controller metadata pressure signal.
  - rule_id: kafka.cluster.replica_placement.single_failure_domain
    intent: Multi-AZ/rack survivability signal.
  - rule_id: kafka.topic.replication_factor.low
    intent: Topic durability baseline.
  - rule_id: kafka.topic.min_insync_replicas.missing
    intent: Topic write durability baseline.
  - rule_id: kafka.topic.min_insync_replicas.unsafe
    intent: Topic write durability baseline.
  - rule_id: kafka.topic.retention_ms.unbounded
    intent: Storage growth risk.
  - rule_id: kafka.topic.retention_ms.low
    intent: Replay-window risk.
  - rule_id: kafka.topic.retention_bytes.missing
    intent: Storage sustainability risk.
  - rule_id: kafka.topic.retention_bytes.large
    intent: Storage sustainability risk.
  - rule_id: kafka.topic.cleanup_policy.missing
    intent: Storage cleanup risk.
  - rule_id: kafka.topic.max_message_bytes.large
    intent: Payload-size operational risk.
  - rule_id: kafka.topic.partitions.low
    intent: Partition parallelism signal.
  - rule_id: kafka.topic.partitions.high
    intent: Operational overhead signal.
  - rule_id: kafka.topic.owner.missing
    intent: Incident routing and ownership signal.
  - rule_id: kafka.topic.schema_compatibility.unsafe
    intent: Consumer compatibility risk.
  - rule_id: kafka.topic.compaction.tombstone_retention.low
    intent: Compaction recovery risk.
  - rule_id: kafka.topic.compaction.dirty_ratio.high
    intent: Compaction pressure risk.
  - rule_id: kafka.topic.compaction.key_cardinality.high
    intent: Compaction efficiency risk.
  - rule_id: kafka.topic.compacted_without_retention_bytes
    intent: Compacted-topic storage risk.
  - rule_id: kafka.topic.message_size_relative_segment
    intent: Segment/message sizing risk.
  - rule_id: kafka.topic.replica_placement.single_failure_domain
    intent: Topic-level AZ/rack placement risk.
  - rule_id: kafka.broker.default_replication_factor.low
