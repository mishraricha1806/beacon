[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-readiness"
version = "0.1.6"
description = "Production-readiness intelligence for distributed systems"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [
    {name = "Richa Mishra", email = "mishraricha1806@gmail.com"}
]
keywords = [
    "kafka",
    "kubernetes",
    "terraform",
    "infrastructure",
    "readiness",
    "diagnostics",
    "production",
    "platform-engineering",
    "sre",
    "devops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "python-hcl2>=4.0.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "confluent-kafka>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]
build = [
    "pyinstaller>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/mishraricha1806/beacon"
Documentation = "https://github.com/mishraricha1806/beacon/blob/main/README.md"
Repository = "https://github.com/mishraricha1806/beacon"
Issues = "https://github.com/mishraricha1806/beacon/issues"

[project.scripts]
beacon = "beacon.cli:app"

[tool.setuptools.packages.find]
include = ["beacon*"]

[tool.setuptools.package-data]
beacon = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
