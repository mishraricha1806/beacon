name: Beacon Readiness Review
description: Run the deterministic Beacon CLI and emit versioned report and release-evidence artifacts.

inputs:
  scan-path:
    description: Repository path to scan.
    required: false
    default: .
  environment:
    description: Beacon environment profile (dev, test, staging, or prod).
    required: false
    default: prod
  fail-on:
    description: Lowest severity that fails the CI gate.
    required: false
    default: high
  python-version:
    description: Python version used to run Beacon.
    required: false
    default: "3.11"
  baseline-evidence:
    description: Optional path to previous Beacon release evidence for changed-risk comparison.
    required: false
    default: ""
  observability-review:
    description: Optional path to a versioned Beacon observability review YAML or JSON file.
    required: false
    default: ""

outputs:
  report-path:
    description: Versioned full JSON report.
    value: beacon-reports/beacon-report.json
  evidence-path:
    description: Versioned release-evidence JSON.
    value: beacon-reports/beacon-release-evidence.json
  sarif-path:
    description: SARIF 2.1.0 findings for code-scanning systems.
    value: beacon-reports/beacon-results.sarif
  junit-path:
    description: JUnit XML findings for CI test-report systems.
    value: beacon-reports/beacon-results.xml
  comparison-path:
    description: JSON changed-risk comparison when baseline-evidence is provided.
    value: beacon-reports/beacon-comparison.json
  comparison-markdown-path:
    description: Markdown changed-risk comparison when baseline-evidence is provided.
    value: beacon-reports/beacon-comparison.md
  pack-validation-path:
    description: Readiness-pack manifest validation result.
    value: beacon-reports/beacon-pack-validation.json

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Beacon CLI
      shell: bash
      env:
        BEACON_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "${BEACON_ACTION_PATH}/../../.."

    - name: Validate readiness packs
      shell: bash
      run: |
        set +e
        set -o pipefail
        mkdir -p beacon-reports
        beacon packs validate --output json \
          | tee beacon-reports/beacon-pack-validation.json
        pack_exit_code=${PIPESTATUS[0]}
        echo "BEACON_PACK_EXIT_CODE=${pack_exit_code}" >> "${GITHUB_ENV}"
        exit 0

    - name: Run deterministic readiness review
      shell: bash
      env:
        BEACON_SCAN_PATH: ${{ inputs.scan-path }}
        BEACON_ENVIRONMENT: ${{ inputs.environment }}
        BEACON_FAIL_ON: ${{ inputs.fail-on }}
        BEACON_OBSERVABILITY_REVIEW: ${{ inputs.observability-review }}
      run: |
        set +e
        set -o pipefail
        mkdir -p beacon-reports
        review_args=()
        if [ -n "${BEACON_OBSERVABILITY_REVIEW}" ]; then
          review_args+=(--observability-review "${BEACON_OBSERVABILITY_REVIEW}")
        fi
        beacon readiness all \
          --static-path "${BEACON_SCAN_PATH}" \
          "${review_args[@]}" \
          --environment "${BEACON_ENVIRONMENT}" \
          --no-html \
          --no-open-report \
          --output json \
          --ci \
          --fail-on "${BEACON_FAIL_ON}" \
          --evidence-output beacon-reports/beacon-release-evidence.json \
          --sarif-output beacon-reports/beacon-results.sarif \
          --junit-output beacon-reports/beacon-results.xml \
          | tee beacon-reports/beacon-report.json
        beacon_exit_code=${PIPESTATUS[0]}
        echo "BEACON_EXIT_CODE=${beacon_exit_code}" >> "${GITHUB_ENV}"
        exit 0

    - name: Compare readiness with baseline
      if: ${{ inputs.baseline-evidence != '' }}
      shell: bash
      env:
        BEACON_BASELINE_EVIDENCE: ${{ inputs.baseline-evidence }}
      run: |
        beacon compare \
          "${BEACON_BASELINE_EVIDENCE}" \
          beacon-reports/beacon-release-evidence.json \
          --output json \
          --markdown-output beacon-reports/beacon-comparison.md \
          | tee beacon-reports/beacon-comparison.json
        beacon compare \
          "${BEACON_BASELINE_EVIDENCE}" \
          beacon-reports/beacon-release-evidence.json \
          --output markdown \
          >> "${GITHUB_STEP_SUMMARY}"

    - name: Enforce configured readiness gate
      shell: bash
      run: |
        if [ "${BEACON_PACK_EXIT_CODE:-1}" -ne 0 ]; then
          exit 2
        fi
        exit "${BEACON_EXIT_CODE:-2}"
