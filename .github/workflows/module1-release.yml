name: Module 1 Release

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  module1-release:
    name: Module 1 release checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit and contract tests
        run: python scripts/release_check_all.py --require-helm

      - name: Validate governed readiness packs
        run: python -m beacon.cli packs validate

      - name: Smoke test runtime readiness JSON
        run: python -m beacon.cli readiness snapshot examples/supported/runtime/all-runtime.yaml --no-html --no-open-report --output json

      - name: Smoke test OpenTelemetry readiness JSON
        run: python -m beacon.cli readiness opentelemetry examples/supported/opentelemetry/checkout-otel.yaml --no-html --no-open-report --output json
