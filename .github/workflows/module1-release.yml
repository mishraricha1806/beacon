name: Module 1 Release

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module1-release:
    name: Module 1 release checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock

      - name: Run unit and contract tests
        run: python scripts/release_check_all.py --require-helm

      - name: Validate governed readiness packs
        run: python -m beacon.cli packs validate

      - name: Smoke test runtime readiness JSON
        run: python -m beacon.cli readiness snapshot examples/supported/runtime/all-runtime.yaml --no-html --no-open-report --output json

      - name: Smoke test OpenTelemetry readiness JSON
        run: python -m beacon.cli readiness opentelemetry examples/supported/opentelemetry/checkout-otel.yaml --no-html --no-open-report --output json
