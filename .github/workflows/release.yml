name: Build Private Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example v0.1.2"
        required: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run release checks
        run: python scripts/release_check_all.py --require-helm

  build-binaries:
    name: Build Standalone Binaries
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact-name: beacon-macos
          - os: ubuntu-latest
            platform: linux
            artifact-name: beacon-linux
          - os: windows-latest
            platform: windows
            artifact-name: beacon-windows.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install binary build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build binary
        run: python scripts/build_binaries.py ${{ matrix.platform }}

      - name: Import Apple installer signing certificate
        if: matrix.platform == 'macos'
        env:
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MACOS_INSTALLER_CERTIFICATE_BASE64}" ]; then
            echo "No Apple installer certificate configured; macOS pkg will be unsigned."
            exit 0
          fi

          KEYCHAIN_PASSWORD="${MACOS_SIGNING_KEYCHAIN_PASSWORD:-temporary-beacon-keychain-password}"
          KEYCHAIN_PATH="${RUNNER_TEMP}/beacon-signing.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id-installer.p12"

          printf '%s' "${MACOS_INSTALLER_CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${MACOS_INSTALLER_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

      - name: Build macOS installer package
        if: matrix.platform == 'macos'
        env:
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          package_cmd=(python scripts/build_macos_pkg.py --skip-binary-build)
          if [ -n "${MACOS_INSTALLER_SIGN_IDENTITY}" ]; then
            package_cmd+=(--sign-identity "${MACOS_INSTALLER_SIGN_IDENTITY}")
          fi

          if [ -n "${APPLE_ID}" ] && [ -n "${APPLE_TEAM_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ]; then
            package_cmd+=(
              --notarize
              --apple-id "${APPLE_ID}"
              --apple-team-id "${APPLE_TEAM_ID}"
              --apple-password "${APPLE_APP_SPECIFIC_PASSWORD}"
            )
          else
            echo "Apple notarization credentials are incomplete; macOS pkg will not be notarized."
          fi

          "${package_cmd[@]}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist-binaries/${{ matrix.artifact-name }}
            dist-binaries/*.pkg
            dist-binaries/*.pkg.sha256

  create-internal-release:
    name: Create Internal Source-Repo Release
    runs-on: ubuntu-latest
    needs:
      - build-binaries

    # GitHub automatically attaches source-code archives to every release
    # created from this source repository. Keep this disabled by default so
    # external users are not sent a source-repo release by accident.
    if: ${{ false }}

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create release notes
        run: |
          cat > release-notes.md << EOF
          # Beacon ${GITHUB_REF_NAME}

          Beacon is a production-readiness intelligence tool for modern infrastructure.

          ## Distribution

          This is an internal source-repository release.

          Do not share this release with external users. GitHub automatically
          attaches source-code archives to source-repository releases.

          For external users, publish the installer and binaries from this build
          to an artifact-only distribution repository.

          ## Downloads

          - macOS installer: \`beacon-<version>-macos.pkg\`
          - macOS raw binary: \`beacon-macos\`
          - Linux: \`beacon-linux\`
          - Windows: \`beacon-windows.exe\`

          ## Usage

          ### macOS

          \`\`\`bash
          sudo installer -pkg beacon-<version>-macos.pkg -target /
          beacon --help
          \`\`\`

          ### Linux

          \`\`\`bash
          chmod +x beacon-linux
          ./beacon-linux --help
          \`\`\`

          ### Windows

          \`\`\`powershell
          beacon-windows.exe --help
          \`\`\`

          ## Module 1 Features

          - Static production-readiness analysis
          - Kafka configuration readiness
          - Kubernetes manifest readiness
          - Terraform infrastructure scanning
          - Object storage readiness checks
          - IAM risk checks
          - Runtime snapshot evaluation
          - HTML and JSON reporting
          - Module 1 release validation

          ## Documentation

          https://github.com/mishraricha1806/beacon
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/beacon-macos/*.pkg
            release-artifacts/beacon-macos/*.pkg.sha256
            release-artifacts/beacon-macos/beacon-macos
            release-artifacts/beacon-linux/beacon-linux
            release-artifacts/beacon-windows.exe/beacon-windows.exe
          body_path: release-notes.md
          draft: false
          prerelease: false

  publish-distribution-release:
    name: Publish Artifact-Only Distribution Release
    runs-on: ubuntu-latest
    needs:
      - build-binaries

    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.DISTRIBUTION_REPO != '' }}

    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create distribution release notes
        run: |
          cat > release-notes.md << EOF
          # Beacon ${GITHUB_REF_NAME}

          Beacon provides production-readiness intelligence for distributed systems.

          ## Downloads

          - macOS installer: \`beacon-${GITHUB_REF_NAME#v}-macos.pkg\`
          - macOS checksum: \`beacon-${GITHUB_REF_NAME#v}-macos.pkg.sha256\`
          - macOS raw binary fallback: \`beacon-macos\`
          - Linux binary: \`beacon-linux\`
          - Windows binary: \`beacon-windows.exe\`

          ## Install

          macOS:

          \`\`\`bash
          sudo installer -pkg beacon-${GITHUB_REF_NAME#v}-macos.pkg -target /
          beacon --help
          \`\`\`

          Linux:

          \`\`\`bash
          chmod +x beacon-linux
          ./beacon-linux --help
          \`\`\`

          Windows:

          \`\`\`powershell
          beacon-windows.exe --help
          \`\`\`

          ## Source Privacy

          This distribution repository contains only release artifacts and public
          installation notes. Beacon source code is not published here.
          EOF

      - name: Publish release to artifact-only repository
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_REPO_TOKEN }}
          DISTRIBUTION_REPO: ${{ vars.DISTRIBUTION_REPO }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "DISTRIBUTION_REPO_TOKEN secret is required"
            exit 1
          fi

          branch_count="$(gh api "repos/${DISTRIBUTION_REPO}/branches" --jq 'length')"
          target_branch="$(gh api "repos/${DISTRIBUTION_REPO}" --jq '.default_branch // "main"')"
          if [ -z "${target_branch}" ] || [ "${target_branch}" = "null" ]; then
            target_branch="main"
          fi

          if [ "${branch_count}" = "0" ]; then
            echo "Distribution repository is empty; creating initial ${target_branch} branch."
            bootstrap_dir="$(mktemp -d)"
            git init -b "${target_branch}" "${bootstrap_dir}"
            cd "${bootstrap_dir}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf '%s\n' \
              '# Beacon' \
              '' \
              'Production-readiness intelligence for distributed systems.' \
              '' \
              'Download the latest Beacon installer or binary from Releases.' \
              '' \
              'This repository contains distribution artifacts only. Beacon source code is not published here.' \
              > README.md
            git add README.md
            git commit -m "Initialize Beacon distribution repository"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${DISTRIBUTION_REPO}.git"
            git push origin "${target_branch}"
            cd -
          fi

          files=(
            release-artifacts/beacon-macos/*.pkg
            release-artifacts/beacon-macos/*.pkg.sha256
            release-artifacts/beacon-macos/beacon-macos
            release-artifacts/beacon-linux/beacon-linux
            release-artifacts/beacon-windows.exe/beacon-windows.exe
          )

          if gh release view "${RELEASE_TAG}" --repo "${DISTRIBUTION_REPO}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --repo "${DISTRIBUTION_REPO}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --repo "${DISTRIBUTION_REPO}" \
              --target "${target_branch}" \
              --title "Beacon ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
