rule_id: kafka.cluster.replica_placement.single_failure_domain
version: "1.0"
title: Kafka cluster replica placement single failure domain
description: Live Kafka metadata shows partitions whose replicas are all placed in the same rack or availability zone.
severity_default: CRITICAL
category: resiliency
author: beacon.runtime
recommendation: Reassign replicas so each partition spans multiple failure domains and verify broker.rack placement.
tags: [kafka, runtime, rack-awareness, replica-placement]
