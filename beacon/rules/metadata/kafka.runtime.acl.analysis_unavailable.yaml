rule_id: kafka.runtime.acl.analysis_unavailable
version: '1.0'
title: Kafka ACL analysis unavailable
description: The active Kafka client does not expose a read-only ACL describe API.
severity_default: LOW
category: operational_safety
author: beacon.runtime
recommendation: Provide ACL exports or use a Kafka client/platform that supports describe_acls
  for authorization posture checks.
