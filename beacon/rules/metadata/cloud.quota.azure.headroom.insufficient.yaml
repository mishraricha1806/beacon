rule_id: cloud.quota.azure.headroom.insufficient
title: Azure quota headroom insufficient
description: Detects Azure quota profiles that cannot satisfy requested capacity plus reserved buffer.
severity_default: CRITICAL
category: scalability
author: beacon.rules
version: "1.0"
tags: [cloud, azure, quota, capacity]
recommendation: Request quota increase, reduce requested capacity, or revise the safety buffer before production rollout.
