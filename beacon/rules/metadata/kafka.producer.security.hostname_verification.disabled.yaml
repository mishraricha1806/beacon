rule_id: kafka.producer.security.hostname_verification.disabled
title: Kafka producer TLS hostname verification disabled
description: Detects Kafka producers with TLS endpoint identification disabled.
severity_default: MEDIUM
category: operational_safety
author: beacon.rules
recommendation: Set ssl.endpoint.identification.algorithm=https for production Kafka producers unless an approved private PKI exception exists.
version: "1.0"
tags: [kafka, producer, security, tls]
